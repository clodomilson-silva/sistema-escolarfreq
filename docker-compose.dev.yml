services:
  # PostgreSQL Database
  db-dev:
    image: postgres:14-alpine
    container_name: sistema-escolar-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sistema_escolar
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - sistema-escolar-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Development Service (Django)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: sistema-escolar-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=db-dev
      - DB_NAME=sistema_escolar
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db-dev:
        condition: service_healthy
    networks:
      - sistema-escolar-dev-network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # Frontend Development Service
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sistema-escolar-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sistema-escolar-dev-network
    command: npm run dev -- --host
    depends_on:
      - backend-dev

networks:
  sistema-escolar-dev-network:
    driver: bridge
    name: sistema-escolar-dev-network

volumes:
  postgres_data_dev:
    driver: local
